services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_crm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: erp_crm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: erp_crm_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/erp_crm_db?schema=public"
      JWT_SECRET: "super-secret-access-token-key-2026"
      JWT_REFRESH_SECRET: "super-secret-refresh-token-key-2026"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      - postgres

  client:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: erp_crm_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
