name: Loop Readiness Audit Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  readiness-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Run Loop Readiness Audit
        run: node scripts/loop-readiness.js
